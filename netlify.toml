[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

# SSR/deep-link fallback: every route that isn't a static asset is handled by the
# server handler, so refreshing or opening any URL directly works.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
